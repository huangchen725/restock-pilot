# 历史文件名兼容参考；不能复制为产品运行配置。
# 产品由 app/agent_runtime.py 生成临时 CODEX_HOME 和受控模型入口。
# 注意：TOML 中顶层键必须写在所有 [table] 段之前，
# 否则会被解析进上一个 table（sandbox/approval 曾因此失效）

model = "intern-s2"
model_context_window = 262144
sandbox_mode = "read-only"
approval_policy = "never"

[features]
shell_tool = false
view_image = false
browser_use = false
computer_use = false
apps = false
plugins = false
code_mode = false
